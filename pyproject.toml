[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroops"
version = "1.0.0"
description = "Prédiction des retards et optimisation des opérations aériennes"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1", "numpy>=1.26", "pyarrow>=14", "scikit-learn>=1.4", "xgboost>=2.1",
    "sqlalchemy>=2.0", "psycopg2-binary>=2.9", "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aeroops = "aeroops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
