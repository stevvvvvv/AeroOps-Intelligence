services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aeroops
      POSTGRES_PASSWORD: aeroops
      POSTGRES_DB: aeroops
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroops"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://aeroops:aeroops@db:5432/aeroops
      AEROOPS_DATA_DIR: /app/data
      AEROOPS_MODELS_DIR: /app/models
    ports: ["8000:8000"]
    volumes: [data:/app/data, models:/app/models]
    depends_on:
      db: { condition: service_healthy }

  # Orchestration (optionnelle) : docker compose --profile airflow up
  airflow:
    image: apache/airflow:2.10.3-python3.11
    profiles: ["airflow"]
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATABASE_URL: postgresql+psycopg2://aeroops:aeroops@db:5432/aeroops
      AEROOPS_DATA_DIR: /app/data
      AEROOPS_MODELS_DIR: /app/models
      PYTHONPATH: /app/src
      _PIP_ADDITIONAL_REQUIREMENTS: "xgboost scikit-learn pyarrow psycopg2-binary"
    ports: ["8080:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/app/src
      - ./sql:/app/sql
      - data:/app/data
      - models:/app/models
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  data:
  models:
